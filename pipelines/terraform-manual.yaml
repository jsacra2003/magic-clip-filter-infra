# Manually triggered pipeline. Run with:
#   gcloud builds submit . \
#     --config=pipelines/terraform-manual.yaml \
#     --project=ge-bootcamp26lis-902 \
#     --substitutions=_ACTION=plan
#
# _ACTION can be: plan | apply | destroy
steps:
  - name: "hashicorp/terraform:1.9"
    id: tf-init
    entrypoint: terraform
    args:
      - init
      - "-backend-config=bucket=${_TF_STATE_BUCKET}"
      - "-backend-config=prefix=${_TF_STATE_PREFIX}"
      - "-input=false"
    dir: "environments/${_ENV}"

  - name: "hashicorp/terraform:1.9"
    id: tf-plan
    entrypoint: terraform
    args:
      - plan
      - "-input=false"
      - "-lock-timeout=300s"
      - "-out=/workspace/tfplan"
    dir: "environments/${_ENV}"
    waitFor: ["tf-init"]

  - name: "hashicorp/terraform:1.9"
    id: tf-apply
    entrypoint: sh
    args:
      - "-c"
      - |
        if [ "${_ACTION}" = "apply" ]; then
          terraform apply -auto-approve -lock-timeout=300s /workspace/tfplan
        elif [ "${_ACTION}" = "destroy" ]; then
          terraform destroy -auto-approve -lock-timeout=300s
        else
          echo "Action is 'plan' — skipping apply."
        fi
    dir: "environments/${_ENV}"
    waitFor: ["tf-plan"]

substitutions:
  _ENV: dev
  _TF_STATE_BUCKET: ge-bootcamp26lis-902-magic-clip-filter-tfstate
  _TF_STATE_PREFIX: magic-clip-filter/dev
  _ACTION: plan

logsBucket: "gs://${_TF_STATE_BUCKET}/build-logs"
options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  substitutionOption: ALLOW_LOOSE
